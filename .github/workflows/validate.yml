name: validate-manuscript

on:
  push:
  pull_request:

jobs:
  numerical-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results/junit.xml
      - run: python code/figures.py
      - run: python code/final_scientific_figures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-test-report
          path: test-results/junit.xml

  latex-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - run: |
          cd manuscript
          latexmk -C
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - run: python3 scripts/package_submission.py
      - uses: actions/upload-artifact@v4
        with:
          name: universe-generic-source
          path: submission/universe-source.zip
