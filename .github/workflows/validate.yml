name: validate-manuscript

on:
  push:
  pull_request:

jobs:
  numerical-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e "./product[dev,astrometry,joint-research]"
      - run: node product/scripts/check_web_interpretation.mjs
      - run: python -m pytest -q --junitxml=test-results/junit.xml
      - run: python code/figures.py
      - run: python code/final_scientific_figures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-test-report
          path: test-results/junit.xml

  latex-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - run: |
          cd manuscript
          latexmk -C
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - run: python3 scripts/package_submission.py
      - uses: actions/upload-artifact@v4
        with:
          name: universe-generic-source
          path: submission/universe-source.zip

  tracker-latex-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - run: latexmk -cd -pdf -interaction=nonstopmode -halt-on-error papers/bhsm_blackhole_tracker_20261021/manuscript/main.tex
      - run: |
          mkdir -p tracker-artifacts
          cp papers/bhsm_blackhole_tracker_20261021/manuscript/main.pdf tracker-artifacts/BHSM_Blackhole_Tracker_Manuscript.pdf
      - run: python3 papers/bhsm_blackhole_tracker_20261021/scripts/package_release.py tracker-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-manuscript
          path: |
            tracker-artifacts/BHSM_Blackhole_Tracker_Manuscript.pdf
            tracker-artifacts/BHSM_Blackhole_Tracker_Source.zip

  tracker-wheel-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install full product test dependencies including optional astrometry
        run: python -m pip install -e "./product[dev,astrometry,joint-research]"
      - name: Product contracts, both joint versions, browser fixture and replay
        working-directory: product
        run: python -m pytest -q tests --junitxml=../test-results/product-junit.xml
      - name: Replay deterministic research controls without observations
        working-directory: product
        shell: python
        run: |
          from pathlib import Path
          import os, subprocess, sys
          subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", "research/known2023_student_20261024", "-p", "test*.py", "-v"], check=True)
          output = Path(os.environ["RUNNER_TEMP"]) / "tracker-ideal-algebra-replay"
          subprocess.run([sys.executable, "research/bhsm_claim_20261024/replay_ideal_controls.py", "--output", str(output)], check=True)
      - run: python -m build --wheel --outdir wheelhouse ./product
      - run: python product/scripts/check_installed_wheel.py --wheel-dir wheelhouse --output test-results/wheel-smoke.json
      - name: Optional joint route from an isolated astrometry wheel installation
        shell: python
        run: |
          from pathlib import Path
          import os, subprocess, sys, tempfile, venv
          workspace = Path.cwd()
          wheels = list((workspace / "wheelhouse").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("Expected exactly one freshly built tracker wheel")
          probe = workspace / "product/scripts/probe_joint_install.py"
          output = workspace / "test-results/joint-wheel-smoke.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          environment = os.environ.copy()
          for name in ("PYTHONPATH", "PYTHONHOME"):
              environment.pop(name, None)
          environment.update(PYTHONNOUSERSITE="1", MPLBACKEND="Agg", OPENBLAS_NUM_THREADS="1", OMP_NUM_THREADS="1")
          with tempfile.TemporaryDirectory(prefix="bhsm optional joint wheel ") as directory:
              outside = Path(directory)
              venv.EnvBuilder(with_pip=True).create(outside / "venv")
              python = outside / "venv" / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              subprocess.run([str(python), "-I", "-m", "pip", "install", str(wheels[0]) + "[astrometry]"], cwd=outside, env=environment, check=True, timeout=600)
              subprocess.run([str(python), "-I", str(probe), "--output", str(output)], cwd=outside, env=environment, check=True, timeout=600)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracker-wheel-${{ matrix.os }}
          path: |
            test-results/wheel-smoke.json
            test-results/joint-wheel-smoke.json
            test-results/product-junit.xml
            wheelhouse/*.whl

  tracker-known-wheel:
    needs: tracker-wheel-smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: tracker-wheel-${{ matrix.os }}
          path: tracker-wheel-input
      - name: Test the Gaussian research engine from the wheel outside the checkout
        shell: python
        run: |
          from pathlib import Path
          import json, os, shutil, subprocess, sys, tempfile, venv
          workspace = Path.cwd()
          wheels = list((workspace / 'tracker-wheel-input').rglob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit('Expected one wheel from the wheel-smoke job')
          tests = workspace / 'product/tests'
          report = workspace / 'test-results/known-wheel-tests.xml'
          report.parent.mkdir(parents=True, exist_ok=True)
          environment = os.environ.copy()
          for name in ('PYTHONPATH', 'PYTHONHOME'):
              environment.pop(name, None)
          environment.update(PYTHONNOUSERSITE='1', PYTEST_DISABLE_PLUGIN_AUTOLOAD='1',
                             MPLBACKEND='Agg', OPENBLAS_NUM_THREADS='1', OMP_NUM_THREADS='1')
          with tempfile.TemporaryDirectory(prefix='bhsm known wheel ') as directory:
              outside = Path(directory)
              fixture_root = outside / 'fixture-source'
              copied_tests = fixture_root / 'tests'
              copied_tests.mkdir(parents=True)
              for name in ('test_known_system_v3.py', 'test_known_system_cli.py'):
                  shutil.copy2(tests / name, copied_tests / name)
              shutil.copytree(tests / 'known_system_v3_reference', copied_tests / 'known_system_v3_reference')
              shutil.copy2(tests.parent / 'pyproject.toml', fixture_root / 'pyproject.toml')
              origins = report.with_name('known-wheel-origins.json')
              (fixture_root / 'conftest.py').write_text(
                  'from pathlib import Path\n'
                  'import json, sys\n'
                  'def pytest_sessionstart(session):\n'
                  '    import bhtracker\n'
                  '    from bhtracker import known_system_v3\n'
                  '    prefix = Path(sys.prefix).resolve()\n'
                  '    package = Path(bhtracker.__file__).resolve()\n'
                  '    engine = Path(known_system_v3.__file__).resolve()\n'
                  '    assert package.is_relative_to(prefix) and engine.is_relative_to(prefix)\n'
                  '    record = {"passed": True, "package": str(package), "engine": str(engine), "prefix": str(prefix), "isolated": bool(sys.flags.isolated)}\n'
                  f'    Path({str(origins)!r}).write_text(json.dumps(record, indent=2) + "\\n", encoding="utf-8")\n',
                  encoding='utf-8')
              venv.EnvBuilder(with_pip=True).create(outside / 'venv')
              python = outside / 'venv' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              subprocess.run([str(python), '-I', '-m', 'pip', 'install',
                              str(wheels[0]) + '[joint-research]', 'pytest>=8'],
                             cwd=outside, env=environment, check=True, timeout=600)
              subprocess.run([str(python), '-I', '-c',
                              'from pathlib import Path; import sys, bhtracker; '
                              'from bhtracker.known_system_v3 import availability; '
                              'assert Path(bhtracker.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()); '
                              'assert availability()["available"]'],
                             cwd=outside, env=environment, check=True, timeout=60)
              subprocess.run([str(python), '-I', '-m', 'pytest', '-q',
                              str(copied_tests / 'test_known_system_v3.py'),
                              str(copied_tests / 'test_known_system_cli.py'), '--junitxml', str(report)],
                             cwd=outside, env=environment, check=True, timeout=600)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracker-known-wheel-${{ matrix.os }}
          path: |
            test-results/known-wheel-tests.xml
            test-results/known-wheel-origins.json
