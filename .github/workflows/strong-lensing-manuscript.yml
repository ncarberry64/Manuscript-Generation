name: Strong-lensing manuscript

on:
  push:
    paths:
      - "manuscript/**"
      - "scripts/build_strong_lensing_manuscript.py"
      - "code/strong_lensing*.py"
      - "code/strong_lensing_revision_filter.c"
      - "tests/test_strong_lensing_surface_source.py"
      - "tests/test_strong_lensing_refit.py"
      - "tests/test_strong_lensing_robustness.py"
      - "tests/test_strong_lensing_encounter_accuracy.py"
      - "tests/test_strong_lensing_observed_*.py"
      - "tests/test_strong_lensing_*revision.py"
      - "tests/test_strong_lensing_hst_central.py"
      - "tests/test_strong_lensing_gaia_validation.py"
      - "tests/test_strong_lensing_gaia_runner.py"
      - "tests/test_strong_lensing_*psf.py"
      - "tests/test_strong_lensing_pixel_geometry.py"
      - "tests/test_strong_lensing_*mask*.py"
      - "tests/test_strong_lensing_read_history.py"
      - "tests/test_strong_lensing_joint_scene.py"
      - "tests/test_strong_lensing_*calibration*.py"
      - "tests/test_strong_lensing_*covariance.py"
      - "tests/test_strong_lensing_*response*.py"
      - "tests/test_strong_lensing_native_*.py"
      - "tests/test_strong_lensing_bounded_collection.py"
      - "tests/test_strong_lensing_early_rate.py"
      - "tests/test_strong_lensing_temporal_*.py"
      - "tests/test_he0435*.py"
      - "data/strong_lensing_observed_20261020/**"
      - "data/strong_lensing_revision_20261020/**"
      - "scripts/*he0435*.py"
      - "scripts/r1_screened_review/check_remaining_field_algebra.py"
      - "scripts/run_strong_lensing_*.py"
      - "requirements-strong-lensing-review.txt"
      - "requirements-strong-lensing-geometry.txt"
      - ".github/workflows/strong-lensing-manuscript.yml"
  pull_request:
    paths:
      - "manuscript/**"
      - "scripts/build_strong_lensing_manuscript.py"
      - "code/strong_lensing*.py"
      - "code/strong_lensing_revision_filter.c"
      - "tests/test_strong_lensing_surface_source.py"
      - "tests/test_strong_lensing_refit.py"
      - "tests/test_strong_lensing_robustness.py"
      - "tests/test_strong_lensing_encounter_accuracy.py"
      - "tests/test_strong_lensing_observed_*.py"
      - "tests/test_strong_lensing_*revision.py"
      - "tests/test_strong_lensing_hst_central.py"
      - "tests/test_strong_lensing_gaia_validation.py"
      - "tests/test_strong_lensing_gaia_runner.py"
      - "tests/test_strong_lensing_*psf.py"
      - "tests/test_strong_lensing_pixel_geometry.py"
      - "tests/test_strong_lensing_*mask*.py"
      - "tests/test_strong_lensing_read_history.py"
      - "tests/test_strong_lensing_joint_scene.py"
      - "tests/test_strong_lensing_*calibration*.py"
      - "tests/test_strong_lensing_*covariance.py"
      - "tests/test_strong_lensing_*response*.py"
      - "tests/test_strong_lensing_native_*.py"
      - "tests/test_strong_lensing_bounded_collection.py"
      - "tests/test_strong_lensing_early_rate.py"
      - "tests/test_strong_lensing_temporal_*.py"
      - "tests/test_he0435*.py"
      - "data/strong_lensing_observed_20261020/**"
      - "data/strong_lensing_revision_20261020/**"
      - "scripts/*he0435*.py"
      - "scripts/r1_screened_review/check_remaining_field_algebra.py"
      - "scripts/run_strong_lensing_*.py"
      - "requirements-strong-lensing-review.txt"
      - "requirements-strong-lensing-geometry.txt"
      - ".github/workflows/strong-lensing-manuscript.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source applications
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install focused scientific dependencies
        run: |
          python3 -m venv .venv-lensing
          .venv-lensing/bin/pip install -r requirements-strong-lensing-geometry.txt pytest

      - name: Check source, inverse-fit, profile and distributed-encounter applications
        run: >-
          .venv-lensing/bin/python -m pytest -q
          tests/test_strong_lensing_surface_source.py
          tests/test_strong_lensing_refit.py
          tests/test_strong_lensing_robustness.py
          tests/test_strong_lensing_encounter_accuracy.py
          tests/test_strong_lensing_observed_lightcurve.py
          tests/test_strong_lensing_observed_macro.py
          tests/test_strong_lensing_lightcurve_revision.py
          tests/test_strong_lensing_macro_revision.py
          tests/test_strong_lensing_hst_central.py
          tests/test_strong_lensing_gaia_validation.py
          tests/test_he0435_unused_metadata.py
          tests/test_he0435_revision_validation.py
          tests/test_strong_lensing_gaia_runner.py
          tests/test_strong_lensing_geometry_revision.py
          tests/test_strong_lensing_pixel_geometry.py
          tests/test_strong_lensing_field_psf.py
          tests/test_strong_lensing_standard_psf.py
          tests/test_strong_lensing_jwst_rate_mask.py
          tests/test_strong_lensing_rate_mask_integration.py
          tests/test_strong_lensing_read_history.py
          tests/test_strong_lensing_joint_scene.py
          tests/test_strong_lensing_response_completion.py
          tests/test_strong_lensing_group_calibration.py
          tests/test_strong_lensing_bounded_collection.py
          tests/test_strong_lensing_stochastic_response.py
          tests/test_strong_lensing_reference_covariance.py
          tests/test_strong_lensing_raw_dark_covariance.py
          tests/test_strong_lensing_dark_covariance.py
          tests/test_strong_lensing_early_rate.py
          tests/test_strong_lensing_temporal_curvature.py
          tests/test_strong_lensing_ipc_response.py
          tests/test_strong_lensing_calibration_order.py
          tests/test_strong_lensing_native_calibration.py
          tests/test_strong_lensing_native_ols.py
          tests/test_strong_lensing_native_completion.py
          tests/test_strong_lensing_anchor_covariance.py
          tests/test_strong_lensing_temporal_controls.py

      - name: Check the exact continuation component identities
        run: .venv-lensing/bin/python scripts/r1_screened_review/check_remaining_field_algebra.py --output /tmp/remaining_field_algebra_check.json

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out manuscript sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the MDPI class and manuscript dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ghostscript latexmk \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            texlive-science texlive-pictures texlive-humanities texlive-plain-generic

      - name: Convert official logos and build the strong-lensing manuscript
        run: python3 scripts/build_strong_lensing_manuscript.py

      - name: Upload manuscript PDF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strong-lensing-manuscript
          path: manuscript/strong_lensing_main.pdf
          if-no-files-found: error

      - name: Upload LaTeX diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strong-lensing-latex-logs
          path: |
            manuscript/strong_lensing_main.log
            manuscript/strong_lensing_main.fls
            manuscript/strong_lensing_main.blg
          if-no-files-found: warn
